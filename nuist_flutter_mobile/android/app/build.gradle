plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

apply plugin: "kotlin-android"

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "id.nuist.mobile"
    compileSdkVersion 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        debug.assets.srcDirs += "${buildDir}/generated/flutter_assets/debug"
        profile.assets.srcDirs += "${buildDir}/generated/flutter_assets/profile"
        release.assets.srcDirs += "${buildDir}/generated/flutter_assets/release"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "id.nuist.mobile"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        ndk {
            abiFilters 'arm64-v8a'
        }
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    if (keystorePropertiesFile.exists()) {
        signingConfigs {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (!keystorePropertiesFile.exists()) {
                throw new GradleException(
                    'Missing android/key.properties. Configure the Play upload key before building release.'
                )
            }
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:33.1.2")
    implementation "com.google.firebase:firebase-common"

    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}

def flutterSdkPath = localProperties.getProperty('flutter.sdk')
project.ext.flutterExecutablePathCustom = "${flutterSdkPath}/bin/flutter"
project.ext.flutterProjectRootCustom = rootProject.projectDir.parentFile

def registerManualFlutterAssetsTask(String variantName, String buildMode, String targetPlatform, String ruleName, boolean trackWidgetCreation) {
    def capitalizedVariant = variantName.capitalize()
    def outputDir = file("${buildDir}/generated/flutter_assets/${variantName}")
    def depfile = "${outputDir}/flutter_build.d"
    def flutterExec = project.ext.flutterExecutablePathCustom
    def flutterRootDir = project.ext.flutterProjectRootCustom
    def targetFile = "${project.ext.flutterProjectRootCustom}/lib/main.dart"
    def pubspecFile = "${project.ext.flutterProjectRootCustom}/pubspec.yaml"

    tasks.register("generateManualFlutterAssets${capitalizedVariant}", Exec) {
        workingDir flutterRootDir
        commandLine flutterExec,
            "assemble",
            "--no-version-check",
            "--depfile", depfile,
            "--output", outputDir.absolutePath,
            "-dTargetFile=lib/main.dart",
            "-dTargetPlatform=${targetPlatform}",
            "-dBuildMode=${buildMode}",
            "-dTrackWidgetCreation=${trackWidgetCreation}",
            "-dAndroidArchs=android-arm64",
            ruleName
        inputs.file(targetFile)
        inputs.file(pubspecFile)
        outputs.dir(outputDir)
    }
}

registerManualFlutterAssetsTask(
    "debug",
    "debug",
    "android",
    "debug_android_application",
    true
)

registerManualFlutterAssetsTask(
    "profile",
    "profile",
    "android-arm64",
    "android_aot_bundle_profile_android-arm64",
    false
)

registerManualFlutterAssetsTask(
    "release",
    "release",
    "android-arm64",
    "android_aot_bundle_release_android-arm64",
    false
)

afterEvaluate {
    ["Debug", "Profile", "Release"].each { variant ->
        tasks.named("merge${variant}Assets") {
            dependsOn "generateManualFlutterAssets${variant}"
        }
    }
}
