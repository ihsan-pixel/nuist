; Sesuai validasi upload GTK: setiap berkas maksimal 10 MB.
upload_max_filesize = 12M
# PHP security advisory CVE-2026-109618 recommends keeping request bodies
# bounded; uploads are capped at 12M above, so leave headroom for multipart data.
post_max_size = 16M
max_file_uploads = 20

# Temporary defense for CVE-2026-109619. This must also be set in the
# server-level PHP/FPM configuration because .user.ini is applied too late
# to cover request parsing on affected PHP versions.
session.upload_progress.enabled = Off
